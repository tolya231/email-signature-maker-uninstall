<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature Maker | Your feedback matters</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #f4f6fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 44px 20px 60px;
        }

        .mark {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
        }

        .header-text {
            font-size: 34px;
            color: #1a1d21;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            text-align: center;
        }

        .subtitle {
            font-size: 17px;
            color: #5b6470;
            margin-bottom: 34px;
            text-align: center;
            max-width: 560px;
            line-height: 1.6;
        }

        .form-container {
            background: white;
            border-radius: 14px;
            box-shadow: 0 12px 34px rgba(15, 23, 42, 0.1);
            max-width: 640px;
            width: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 780px;
            border: none;
        }

        @media (max-width: 768px) {
            .header-text {
                font-size: 26px;
            }

            iframe {
                height: 720px;
            }
        }
    </style>
</head>
<body>
    <img class="mark" src="icon128.png" alt="">
    <h1 class="header-text">Sorry to see you go</h1>
    <p class="subtitle">One line about what went wrong — a layout that broke in your mail client, a field
        you needed, a paste that would not stick — is enough to fix it for the next person.</p>

    <div class="form-container">
        <iframe
            src="https://docs.google.com/forms/d/e/1FAIpQLSc35oFD-8ABc2FsmxPcQnOW7in7FDdHLL4ZvBw2u_YSISpcwQ/viewform?embedded=true"
            frameborder="0"
            marginheight="0"
            marginwidth="0">
            Loading…
        </iframe>
    </div>
</body>
</html>
